# Dokploy "Docker Compose" app. Set domains in Dokploy → Domains:
#   web    → ridgeline.<domain>  port 3000
#   bridge → bridge.<domain>     port 4000   (WebSockets pass through Traefik)
# Required env (Dokploy → Environment):
#   BRIDGE_PUBLIC_URL=https://bridge.<domain>
#   WEB_ORIGIN=https://ridgeline.<domain>
#   RIDGELINE_KEY=<presenter secret>
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_BRIDGE_URL: ${BRIDGE_PUBLIC_URL:-http://localhost:4000}
    restart: unless-stopped
    expose: ["3000"]
    networks: [dokploy-network]

  bridge:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      RIDGELINE_KEY: ${RIDGELINE_KEY:-}
      COMPARE_SEEDS: "20"
    volumes:
      - ridgeline-results:/app/server/data
    expose: ["4000"]
    networks: [dokploy-network]
    # State lives in memory, and agents talk by multicast inside this container: exactly one.
    deploy:
      replicas: 1

volumes:
  ridgeline-results:

networks:
  dokploy-network:
    external: true
